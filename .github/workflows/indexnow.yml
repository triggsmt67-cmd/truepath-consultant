name: Notify IndexNow of website changes

on:
  deployment_status:
  schedule:
    - cron: '43 13 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: indexnow-production
  cancel-in-progress: false

jobs:
  notify:
    if: github.event_name != 'deployment_status' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Restore last successful submission history
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/restore-indexnow-state.mjs
      - name: Check live content and notify only changed URLs
        run: node scripts/indexnow.mjs
      - name: Preserve confirmed and pending submission history
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: success()
        with:
          name: indexnow-state
          path: .indexnow/state.json
          retention-days: 90
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: indexnow-result
          path: .indexnow/latest-result.json
          retention-days: 30
          include-hidden-files: true
