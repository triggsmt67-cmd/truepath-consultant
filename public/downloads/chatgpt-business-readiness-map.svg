<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">ChatGPT business setup: three separate checks</title><desc id="desc">Check for a supported business claim, complete required verification, and separately check optional agent eligibility. None guarantees recommendations.</desc><rect width="1200" height="900" fill="#f6f2e9"/><path d="M930 0H1200V245Z" fill="#d5e4cf"/><text x="70" y="69" font-family="Arial,sans-serif" font-size="18" letter-spacing="3" fill="#315c47">TRUE PATH DIGITAL · OWNER’S REFERENCE</text><text x="70" y="143" font-family="Georgia,serif" font-size="54" fill="#203c31">ChatGPT business setup</text><text x="70" y="193" font-family="Arial,sans-serif" font-size="26" fill="#4b5b51">Three checks. Different outcomes.</text>
<rect x="70" y="240" width="1060" height="152" rx="8" fill="#dce8cc"/><text x="102" y="305" font-family="Georgia,serif" font-size="46" fill="#274535">01</text><text x="200" y="288" font-family="Georgia,serif" font-size="32" fill="#203c31">Can you claim this business?</text><text x="200" y="328" font-family="Arial,sans-serif" font-size="22" fill="#31483f">Find the correct listing and an available claim route.</text><text x="200" y="361" font-family="Arial,sans-serif" font-size="21" fill="#31483f">Unavailable? Record it and prepare the business facts.</text><rect x="70" y="415" width="1060" height="152" rx="8" fill="#e8cabc"/><text x="102" y="480" font-family="Georgia,serif" font-size="46" fill="#274535">02</text><text x="200" y="463" font-family="Georgia,serif" font-size="32" fill="#203c31">Is verification approved?</text><text x="200" y="503" font-family="Arial,sans-serif" font-size="22" fill="#31483f">Complete the required claim and identity reviews.</text><text x="200" y="536" font-family="Arial,sans-serif" font-size="21" fill="#31483f">A pending review is not an approval.</text><rect x="70" y="590" width="1060" height="152" rx="8" fill="#cce1e5"/><text x="102" y="655" font-family="Georgia,serif" font-size="46" fill="#274535">03</text><text x="200" y="638" font-family="Georgia,serif" font-size="32" fill="#203c31">Is an agent available?</text><text x="200" y="678" font-family="Arial,sans-serif" font-size="22" fill="#31483f">Check the separate rules for eligible U.S. online businesses.</text><text x="200" y="711" font-family="Arial,sans-serif" font-size="21" fill="#31483f">Profile access does not promise a Business Agent.</text>
<path d="M70 796H1130" stroke="#aeb9ab"/><text x="70" y="832" font-family="Arial,sans-serif" font-size="21" fill="#203c31">Claiming does not guarantee recommendations or inquiries.</text><text x="70" y="868" font-family="Arial,sans-serif" font-size="16" fill="#526457">Beta guidance checked Nov 15, 2026 · Recheck current OpenAI instructions · truepath406.com</text></svg>